<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 5 | Form</title>
    <link rel="stylesheet" href="styles/poll-form.css" </head>

<body>
    <header>

    </header>

    <form>
        <div class="form-item column2">
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required>
        </div>
        <div class="form-item column2">
            <label for="useremail">Email:</label>
            <input type="email" id="useremail" name="useremail" required>
        </div>
    </form>
    <form>

        <label for="quantity">Select Quantity</label>
        <select name="quantity" id="quantity">
            <option value="1">One</option>
            <option value="2">Two</option>
            <option value="3">Three</option>
        </select>

    </form>
    <div class="form-item column 1">
        <label for="browser">What is your favorite internet browser?</label>
        <select id="browser" name="browser">
            <option value="chrome">Chrome</option>
            <option value="firefox">Firefox</option>
            <option value="edge">Edge</option>
            <option value="brave">Brave</option>
            <option value="other">Other</option>
        </select>
    </div>
    </form>
    <form>
        <div class="form-item column1">
            <label for="pet">Do you have a household pet?</label>
            <input type="checkbox" id="pet" name="pet">
        </div>
    </form>
    <form>
        <div class="form-item">
            <label for="feedback">List the places you have lived:</label>
            <textarea id="feedback" name="feedback" rows="4"
              placeholder="Stillwater Florida, Amsterdam Netherlands, Timbuktu Mali"></textarea>
        </div>
    </form>
    <form>
        <button type="submit">Submit Poll</button>
    </form>


    </main>
    <footer>
        <p>© 2026 ◈ Juliana Coutinho Rodrigues ◈ Rio de Janeiro</p>

    </footer>
</body>

</html>
