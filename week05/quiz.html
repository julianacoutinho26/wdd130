<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> HTML & CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <main class="box">
        <h1>✅ BasicHTML & CSS Quiz</h1>
        <form class="box">

            <div class="quiz-item box">
                <label for="q1">1. What is the HTML tag used to create a hyperlink?</label>
                <input type="text" id="q1" name="q1">
            </div>
            <div class="quiz-item box">
                <label for="q2">2. Briefly explain the difference between classes and IDs in
                    CSS:</label>
                <textarea id="q2" name="q2"></textarea>
            </div>
            <div class="quiz-item box">
                <label for="q3">3. Which CSS property controls the size of text?</label>
                <select id="q3" name="q3">
                    <option value="" selected disabled>Choose One...</option>
                    <option value="color">color</option>
                    <option value="font-size">font-size</option>
                    <option value="background">background</option>
                </select>
            </div>
            <div class="quiz-item box">
                <label for="q4">4. How many heading levels (h1–h6) are available in HTML?</label>
                <code class="box"> margin: 10px 5px 15px;</code>
                <input type="number" id="q4" name="q4">
            </div>
            <button type="submit">Submit Quiz</button>
        </form>
    </main>
</body>

</html>
