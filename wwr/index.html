<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page | Rafting and Beyond</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <!-- Hero Section -->
    <header>
        <img src="images/rafting-logo.png" alt="Rafting and Beyond Logo" width="120">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>

        <article>
            <h1>Experience the Thrill of White Water Rafting!</h1>
        </article>
        <img src="images/hero-image.jpg" alt="Rafting Adventure" width="600
        ">
    </header>


    <section class="cta">
        <p>Ready for your next adventure? Explore our exciting trips!</p>
        <a href="trips.html" class="cta-button">View Trips</a>
    </section>


    <section class="newsletter">
        <h2>Sign Up for Our Newsletter</h2>
        <main>
            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <button type="submit">Subscribe</button>
            </form>
        </main>
    </section>


    <main class="gallery">
        <figure>
            <img src="images/ratfing-group.png" alt="Rafting Group">
            <figcaption>
                <h3>Our Purpose</h3>
                <p>We bring people together to experience the thrill of rafting while promoting
                    safety and teamwork.</p>
            </figcaption>
        </figure>
        <figure>
            <img src="images/rafting-rapids.png" alt="Rafting Rapids">
            <figcaption>
                <h3>Our Offerings</h3>
                <p>From beginner-friendly floats to advanced rapids, we have adventures for
                    everyone.</p>
            </figcaption>
        </figure>
    </main>

    <footer>
        <p>&copy; 2026 | Rafting and Beyond | Juliana Coutinho Rodrigues</p>
    </footer>
</body>

</html>
